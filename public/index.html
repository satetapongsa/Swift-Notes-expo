<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Write notes together, in real time. Share notes by email and see edits from your team as they happen." />
    <meta name="theme-color" content="#007AFF" />

    <!-- Browser tab and home-screen icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Link previews (Facebook, LINE, Messenger, Discord, X, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Swift Notes" />
    <meta property="og:title" content="Swift Notes" />
    <meta property="og:description" content="Write notes together, in real time." />
    <meta property="og:url" content="https://swift-notes-expo.vercel.app/" />
    <meta property="og:image" content="https://swift-notes-expo.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Swift Notes app icon and the line: Write notes together, in real time." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Swift Notes" />
    <meta name="twitter:description" content="Write notes together, in real time." />
    <meta name="twitter:image" content="https://swift-notes-expo.vercel.app/og-image.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
